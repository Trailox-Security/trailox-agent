{{- if .Values.serviceAccount.create }}
{{- /* Only for an AWS identity (IRSA, EKS Pod Identity): the agent itself never calls the Kubernetes API. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trailox-agent.serviceAccountName" . }}
  labels:
    {{- include "trailox-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
